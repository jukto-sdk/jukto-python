name: Quality checks

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to check
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v6
        if: matrix.python-version != '3.15'
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build stable Python 3.15 until runner binaries are available
        if: matrix.python-version == '3.15'
        run: |
          # Official 3.15.0 source and SHA-256 from python.org's release page.
          sudo apt-get update -qq
          sudo apt-get install -y libssl-dev zlib1g-dev libbz2-dev libreadline-dev libsqlite3-dev libffi-dev liblzma-dev
          cd "$RUNNER_TEMP"
          curl --fail --location --proto '=https' --tlsv1.2 https://www.python.org/ftp/python/3.15.0/Python-3.15.0.tar.xz -o Python.tar.xz
          echo 'ba4bed1ba346b916890b76d9e320451420aa69f6408997d33c66482eeae3d575  Python.tar.xz' | sha256sum --check
          tar -xf Python.tar.xz
          cd Python-3.15.0
          ./configure --prefix="$RUNNER_TEMP/python-3.15" --with-ensurepip=install > configure.log 2>&1 || { tail -100 configure.log; exit 1; }
          make -j2 > build.log 2>&1 || { tail -100 build.log; exit 1; }
          make install > install.log 2>&1 || { tail -100 install.log; exit 1; }
          ln -s python3.15 "$RUNNER_TEMP/python-3.15/bin/python"
          echo "$RUNNER_TEMP/python-3.15/bin" >> "$GITHUB_PATH"
      - name: Install check dependencies
        run: python -m pip install '.[dev,examples]'
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy
      - name: Tests and branch coverage gate
        run: python -m pytest --cov-report=xml --cov-report=json --cov-report=term-missing
      - name: Strict documentation build
        run: python -m mkdocs build --strict
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check --strict dist/*
          python scripts/release_gate.py
      - name: Install wheel outside checkout
        env:
          CHECKOUT: ${{ github.workspace }}
        run: |
          smoke_dir=$(mktemp -d)
          python -m venv "$smoke_dir/venv"
          "$smoke_dir/venv/bin/python" -m pip install "$CHECKOUT"/dist/*.whl
          version=$(python -c 'import importlib.metadata; print(importlib.metadata.version("jukto"))')
          cd "$smoke_dir"
          "$smoke_dir/venv/bin/python" -I "$CHECKOUT/scripts/wheel_smoke.py" "$CHECKOUT" "$version"
      - name: Upload measured coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: |
            coverage.xml
            coverage.json
          if-no-files-found: error
      - name: Upload tested distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions-python-${{ matrix.python-version }}
          path: dist/*
          if-no-files-found: error
