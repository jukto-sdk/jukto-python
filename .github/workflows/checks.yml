name: Quality checks

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to check
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install check dependencies
        run: python -m pip install '.[dev]'
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy
      - name: Tests and branch coverage gate
        run: python -m pytest --cov-report=xml --cov-report=json --cov-report=term-missing
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check --strict dist/*
          python scripts/release_gate.py
      - name: Install wheel outside checkout
        env:
          CHECKOUT: ${{ github.workspace }}
        run: |
          smoke_dir=$(mktemp -d)
          python -m venv "$smoke_dir/venv"
          "$smoke_dir/venv/bin/python" -m pip install "$CHECKOUT"/dist/*.whl
          version=$(python -c 'import importlib.metadata; print(importlib.metadata.version("jukto"))')
          cd "$smoke_dir"
          "$smoke_dir/venv/bin/python" -I "$CHECKOUT/scripts/wheel_smoke.py" "$CHECKOUT" "$version"
      - name: Upload measured coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: |
            coverage.xml
            coverage.json
          if-no-files-found: error
      - name: Upload tested distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions-python-${{ matrix.python-version }}
          path: dist/*
          if-no-files-found: error
