site_name: Jukto Python SDK
site_description: Sync and native asyncio Python SDK for Bangladesh SMS and logistics APIs. Payments are planned. Native async clients are unreleased. Created by Mehedi Hasan Faysal.
site_author: Mehedi Hasan Faysal
site_url: https://jukto-sdk.github.io/jukto-python/

repo_name: jukto-sdk/jukto-python
repo_url: https://github.com/jukto-sdk/jukto-python

theme:
  name: material
  icon:
    logo: material/api
  palette:
    - scheme: default
      primary: indigo
      accent: blue
    - scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_source: true

nav:
  - Introduction: index.md
  - Integration Guides:
    - Courier / Logistics API (Bangladesh): guides/logistics.md
    - SMS Gateways (Bangladesh): guides/sms.md
    - Django, FastAPI and Testing: guides/frameworks.md
    - Native Async and FastAPI: guides/async.md
  - Exception Handling: guides/errors.md
  - FAQ (AEO & BD Context): faq.md
  - Architecture: architecture.md
  - Provider Contracts and Capabilities: provider-contracts.md
  - CI and Releases: ci-and-releases.md
  - Compatibility and Migration: compatibility.md
  - Contributing: contributing.md
  - Security: security.md
  - Changelog: changelog.md
  - API Reference:
    - Logistics Providers: api/logistics.md
    - SMS Providers: api/sms.md
    - Exceptions: api/exceptions.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true
  - pymdownx.superfences
  - admonition
  - def_list
