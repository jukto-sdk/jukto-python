[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jukto"
version = "0.1.0"
description = "A Python SDK for Bangladesh SMS and logistics APIs; payment integrations are planned."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Mehedi Hasan Faysal", email = "mahdibuilds.hq@gmail.com" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "httpx>=0.27.0",
]

[project.optional-dependencies]
examples = [
  "Django>=4.2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]
dev = [
  "pytest>=8.0.0",
  "mypy>=1.15,<1.20; python_version < '3.10'",
  "mypy>=1.15; python_version >= '3.10'",
  "ruff>=0.9",
  "build>=1.2",
  "twine>=6.0",
  "tomli>=2.0; python_version < '3.11'",
  "PyYAML>=6.0",
  "pytest-httpx>=0.30.0",
  "pytest-cov>=5.0.0",
  "respx>=0.22.0",
  "mkdocs-material>=9.5.0",
  "mkdocstrings[python]>=0.24.0",
]

[project.urls]
"Homepage" = "https://github.com/jukto-sdk/jukto-python"
"Documentation" = "https://jukto-sdk.github.io/jukto-python/"
"Bug Tracker" = "https://github.com/jukto-sdk/jukto-python/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --cov=jukto --cov-branch --cov-fail-under=97 --cov-report=term-missing"

[tool.coverage.report]
precision = 2

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# Correctness checks without imposing a repository-wide style migration.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
files = ["src/jukto", "examples"]
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["django.*"]
ignore_missing_imports = true
