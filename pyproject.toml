[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jukto"
version = "0.1.0"
description = "A unified Python SDK for Bangladesh's third-party APIs (SMS, Logistics, Payment)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Mehedi Hasan Faysal", email = "mahdibuilds.hq@gmail.com" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-httpx>=0.30.0",
  "pytest-cov>=5.0.0",
  "respx>=0.22.0",
  "mkdocs-material>=9.5.0",
  "mkdocstrings[python]>=0.24.0",
]

[project.urls]
"Homepage" = "https://github.com/jukto-sdk/jukto-python"
"Documentation" = "https://jukto-sdk.github.io/jukto-python/"
"Bug Tracker" = "https://github.com/jukto-sdk/jukto-python/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --cov=jukto --cov-report=term-missing"
