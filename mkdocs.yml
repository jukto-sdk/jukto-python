site_name: Jukto Python SDK
site_description: Jukto 0.1.0a1 early-access Python SDK for Bangladesh SMS and courier APIs, with native async clients and experimental SSLCOMMERZ hosted BDT payments. Created by Mehedi H Faysal.
site_author: Mehedi H Faysal
site_url: https://jukto-sdk.github.io/jukto-python/

repo_name: jukto-sdk/jukto-python
repo_url: https://github.com/jukto-sdk/jukto-python

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  icon:
    logo: material/api
  palette:
    - scheme: default
      primary: indigo
      accent: blue
    - scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_source: true

nav:
  - Introduction: index.md
  - Integration Guides:
    - Courier / Logistics API (Bangladesh): guides/logistics.md
    - SMS Gateways (Bangladesh): guides/sms.md
    - Django, FastAPI and Testing: guides/frameworks.md
    - Native Async and FastAPI: guides/async.md
    - Hosted Payments: guides/payments.md
  - Exception Handling: guides/errors.md
  - Frequently Asked Questions: faq.md
  - Architecture: architecture.md
  - Provider Contracts and Capabilities: provider-contracts.md
  - Payment Contract Audit: payment-contracts.md
  - CI and Releases: ci-and-releases.md
  - Compatibility and Migration: compatibility.md
  - Contributing: contributing.md
  - Security: security.md
  - Changelog: changelog.md
  - API Reference:
    - Logistics Providers: api/logistics.md
    - SMS Providers: api/sms.md
    - Payments: api/payments.md
    - Exceptions: api/exceptions.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true
  - pymdownx.superfences
  - admonition
  - def_list

copyright: Copyright © 2026 Mehedi Hasan Faysal
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jukto-sdk/jukto-python
      name: Jukto source code on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/jukto/
      name: Install Jukto from PyPI
    - icon: material/account
      link: https://mahdiblogs.com
      name: Mehedi H Faysal
