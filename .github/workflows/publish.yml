name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The release event SHA cannot follow a tag moved while jobs are queued.
          ref: ${{ github.sha }}
      - name: Resolve immutable release commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  checks:
    needs: resolve
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  build:
    needs: [resolve, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Download exact distributions tested on Python 3.14
        uses: actions/download-artifact@v4
        with:
          name: distributions-python-3.14
          path: dist
      - name: Install metadata checker
        run: python -m pip install twine
      - name: Validate release identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m twine check --strict dist/*
          python scripts/release_gate.py --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error

  pypi-publish:
    needs: [checks, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/jukto
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - name: Publish checked distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
